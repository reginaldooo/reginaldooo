name: Update profile cards

on:
  schedule:
    - cron: '30 17 * * *' # 00:30 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate cards
        run: npm run generate
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-output
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile cards"
            git push
          fi
